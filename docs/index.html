<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Vue Task Board Demo</title>
<style>
:root{--bg:#f3f1eb;--ink:#1a1a1a;--card:#fff;--line:#ddd6c8;--accent:#0f6e56;font-family:"Segoe UI",Tahoma,sans-serif}
*{box-sizing:border-box}body{margin:0;background:linear-gradient(180deg,#e7efe9,var(--bg));color:var(--ink)}
.wrap{max-width:1100px;margin:0 auto;padding:1.5rem}header{display:flex;justify-content:space-between;gap:1rem;flex-wrap:wrap;align-items:end}
h1{margin:0;font-size:1.8rem}.muted{color:#667;margin:.2rem 0 0}.row{display:flex;gap:.5rem}
input{padding:.6rem .75rem;border:1px solid var(--line);border-radius:8px;min-width:180px}
button{border:0;background:var(--accent);color:#fff;border-radius:8px;padding:.6rem .9rem;cursor:pointer}
.board{display:grid;grid-template-columns:repeat(3,1fr);gap:1rem;margin-top:1rem}
section{background:rgba(255,255,255,.7);border:1px solid var(--line);border-radius:12px;padding:.85rem;min-height:260px}
h2{font-size:.95rem;margin:0 0 .75rem;color:#556}
article{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:.75rem;margin-bottom:.6rem}
.moves{display:flex;gap:.3rem;flex-wrap:wrap;margin-top:.5rem}
.moves button{background:#eef4f1;color:#135;font-size:.75rem;padding:.3rem .5rem}
@media(max-width:800px){.board{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="wrap">
<header>
  <div><h1>Task Board</h1><p class="muted">دموی زنده · Vue pattern · localStorage</p></div>
  <form class="row" id="add"><input id="title" placeholder="تسک جدید" required/><button type="submit">افزودن</button></form>
</header>
<div class="board" id="board"></div>
</div>
<script>
const KEY='vtb-demo';
const cols=[{key:'todo',label:'Todo'},{key:'doing',label:'Doing'},{key:'done',label:'Done'}];
const load=()=>JSON.parse(localStorage.getItem(KEY)||'[]');
const save=t=>localStorage.setItem(KEY,JSON.stringify(t));
function seed(){if(!load().length){save([{id:1,title:'طراحی API',status:'done'},{id:2,title:'Vue board',status:'doing'},{id:3,title:'Deploy Pages',status:'todo'}]);}} 
function render(){
  const tasks=load(); const root=document.getElementById('board'); root.innerHTML='';
  for(const col of cols){
    const sec=document.createElement('section');
    sec.innerHTML=`<h2>${col.label}</h2>`;
    tasks.filter(t=>t.status===col.key).forEach(t=>{
      const art=document.createElement('article');
      art.innerHTML=`<p>${t.title}</p><div class="moves"></div>`;
      const moves=art.querySelector('.moves');
      cols.filter(c=>c.key!==col.key).forEach(c=>{
        const b=document.createElement('button'); b.textContent=c.label;
        b.onclick=()=>{t.status=c.key;save(tasks);render()};
        moves.appendChild(b);
      });
      sec.appendChild(art);
    });
    root.appendChild(sec);
  }
}
document.getElementById('add').onsubmit=e=>{
  e.preventDefault();
  const title=document.getElementById('title').value.trim();
  const tasks=load(); tasks.push({id:Date.now(),title,status:'todo'}); save(tasks);
  document.getElementById('title').value=''; render();
};
seed(); render();
</script>
</body>
</html>
